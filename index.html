<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--<meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />-->
  
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    

    <title>BluePen SignApp</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://google.com" async defer></script>
  </head>
  <body>
    <div class="mobile-shell">
      <!-- AUTH SCREEN (LOGIN / SIGNUP / FORGOT PASSWORD) -->
      <section id="authSection" class="screen active">
        <div class="brand-header">
          <div class="pen-logo">🖋️</div>
          <h1>anime signature app</h1>
          <p>Mobile Document Signature App</p>
        </div>

        <!-- Google Login Button -->
        <div
          id="g_id_onload"
          data-client_id="559529666535-5gkoiq6cmapqvajas88v1o1nek7dc0d8.apps.googleusercontent.com"
          data-callback="handleGoogleLogin"
          data-auto_prompt="false"
        ></div>
        <div
          class="g_id_signin"
          data-type="standard"
          data-size="large"
          data-width="280"
        ></div>

        <div class="divider"><span>YA GMAIL SE</span></div>

        <!-- Tabs -->
        <div class="auth-tabs">
          <button class="tab-btn active" onclick="switchAuthTab('login')">
            Login
          </button>
          <button class="tab-btn" onclick="switchAuthTab('signup')">
            Signup
          </button>
          <button class="tab-btn" onclick="switchAuthTab('forgot')">
            Reset Pass
          </button>
        </div>

        <!-- Login Form -->
        <form
          id="loginForm"
          class="auth-form active"
          onsubmit="submitLogin(event)"
        >
          <input
            type="email"
            id="loginEmail"
            placeholder="Apna Gmail daalo"
            required
          />
          <input
            type="password"
            id="loginPass"
            placeholder="Password daalo"
            required
          />
          <button type="submit" class="primary-btn">Login Karo</button>
        </form>

        <!-- Signup Form (With Gmail OTP) -->
        <form id="signupForm" class="auth-form" onsubmit="submitSignup(event)">
          <input type="text" id="signName" placeholder="Poora Naam" required />
          <input
            type="email"
            id="signEmail"
            placeholder="Apna Gmail daalo"
            required
          />
          <div class="otp-row">
            <input
              type="text"
              id="signOtp"
              placeholder="6-Digit OTP"
              required
            />
            <button
              type="button"
              class="otp-btn"
              onclick="sendOtp('signEmail', this)"
            >
              Send OTP
            </button>
          </div>
          <input
            type="password"
            id="signPass"
            placeholder="Naya Password banao"
            required
          />
          <button type="submit" class="primary-btn">Verify & Signup</button>
        </form>

        <!-- Forgot Password Form (PUT API + Gmail OTP) -->
        <form id="forgotForm" class="auth-form" onsubmit="submitReset(event)">
          <input
            type="email"
            id="forgotEmail"
            placeholder="Registered Gmail daalo"
            required
          />
          <div class="otp-row">
            <input
              type="text"
              id="forgotOtp"
              placeholder="6-Digit OTP"
              required
            />
            <button
              type="button"
              class="otp-btn"
              onclick="sendOtp('forgotEmail', this)"
            >
              Send OTP
            </button>
          </div>
          <input
            type="password"
            id="forgotNewPass"
            placeholder="Naya Password daalo"
            required
          />
          <button type="submit" class="primary-btn">
            Password Reset Karein
          </button>
        </form>
      </section>

      <!-- MAIN APP SCREEN -->
      <section id="appSection" class="screen">
        <!-- Top Navbar with Left Hamburger -->
        <header class="top-bar">
          <button class="hamburger-btn" onclick="toggleDrawer(true)">☰</button>
          <span class="app-title">🖋️ anime signature </span>
          <label for="imageInput" class="upload-pill">+ Page</label>
          <input type="file" id="imageInput" accept="image/*" hidden />
        </header>

        <!-- Left Side Hamburger Drawer -->
        <div
          id="drawerOverlay"
          class="drawer-overlay"
          onclick="toggleDrawer(false)"
        ></div>
        <aside id="sideDrawer" class="side-drawer">
          <div class="drawer-profile">
            <div class="avatar" id="userAvatar">U</div>
            <div>
              <h3 id="drawerUserName">User</h3>
              <small id="drawerUserEmail">user@gmail.com</small>
            </div>
          </div>
          <nav class="drawer-links">
            <button onclick="showView('canvasView'); toggleDrawer(false)">
              🖋️ New Signature
            </button>
            <button
              onclick="showView('historyView'); loadSignatures(); toggleDrawer(false)"
            >
              📂 Saved Signatures
            </button>
            <button class="logout-btn" onclick="logout()">🚪 Logout</button>
          </nav>
        </aside>

        <!-- VIEW 1: BLUE PEN SIGNATURE CANVAS -->
        <main id="canvasView" class="view active">
          <div class="canvas-wrapper" id="canvasWrapper">
            <p id="placeholderText">
              Upar <b>"+ Page"</b> dabakar gallery se image/document chunein aur
              Blue Pen se sign karo
            </p>
            <canvas id="signCanvas"></canvas>
          </div>

          <div class="pen-controls">
            <div class="pen-badge">
              <span class="blue-dot"></span> Royal Blue Ball-Pen
            </div>
            <button class="secondary-btn" onclick="clearSignature()">
              🔄 Clear Sign
            </button>
          </div>

          <button class="save-download-btn" onclick="saveAndDownload()">
            💾 Save & Download Image
          </button>
        </main>

        <!-- VIEW 2: SAVED SIGNATURES HISTORY (GET, PUT, DELETE) -->
        <main id="historyView" class="view">
          <h2 class="section-heading">Saved Signatures (MongoDB)</h2>
          <div id="historyList" class="history-list"></div>
        </main>
      </section>
    </div>

    <div id="toast" class="toast"></div>
    <script src="app.js"></script>
  </body>
</html>
